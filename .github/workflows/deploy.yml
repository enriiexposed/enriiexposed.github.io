name: Deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Stack name and region must match infra/bin/infra.ts and infra/constants/index.ts.
env:
  STACK_NAME: PortfolioInfraStack

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            front/package-lock.json
            infra/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: front

      - name: Build frontend
        run: npm run build
        working-directory: front

      - name: Install infra dependencies
        run: npm ci
        working-directory: infra

      - name: Build infra
        run: npm run build
        working-directory: infra

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy infra (CDK)
        working-directory: infra
        run: npx cdk deploy --require-approval never --outputs-file cdk-outputs.json

      - name: Sync frontend build to S3
        working-directory: infra
        run: |
          BUCKET_NAME=$(aws cloudformation describe-stack-resources \
            --stack-name "$STACK_NAME" \
            --query "StackResources[?ResourceType=='AWS::S3::Bucket'].PhysicalResourceId" \
            --output text)
          aws s3 sync ../front/dist "s3://$BUCKET_NAME" --delete

      - name: Invalidate CloudFront cache
        working-directory: infra
        run: |
          DISTRIBUTION_ID=$(aws cloudformation describe-stack-resources \
            --stack-name "$STACK_NAME" \
            --query "StackResources[?ResourceType=='AWS::CloudFront::Distribution'].PhysicalResourceId" \
            --output text)
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"

      - name: Show deployment URL
        working-directory: infra
        run: |
          SITE_URL=$(jq -r ".\"$STACK_NAME\".SiteUrl" cdk-outputs.json)
          echo "Deployment URL: $SITE_URL"
          echo "### Deployment URL" >> "$GITHUB_STEP_SUMMARY"
          echo "$SITE_URL" >> "$GITHUB_STEP_SUMMARY"
